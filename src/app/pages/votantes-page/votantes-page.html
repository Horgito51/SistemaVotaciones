<section class="section-bar">Modificar Votante</section>

<section class="page-body" aria-labelledby="page-title">
  <h1 id="page-title" class="visually-hidden">Modificar Votante</h1>

  <div class="toolbar" aria-label="Busqueda de votantes">
    <label for="cedula">Cedula:</label>
    <input id="cedula" type="text" />
    <button type="button">
      <span>Buscar</span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9.8 4a5.8 5.8 0 1 1 0 11.6A5.8 5.8 0 0 1 9.8 4zm0 2a3.8 3.8 0 1 0 0 7.6A3.8 3.8 0 0 0 9.8 6zm4.47 8.86 1.41-1.41L21 18.76 19.59 20.17l-5.32-5.31z"></path>
      </svg>
    </button>
    <button type="button">
      <span>Enviar Correo</span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h13v10H4V7zm6.5 6L5.8 9v6.3h9.4V9l-4.7 4zm0-2.3L15.2 8.5H5.8l4.7 2.2zM18 9h2v10H7v-1.5h11V9z"></path>
      </svg>
    </button>
  </div>

  <table class="data-table" aria-label="Lista de votantes">
    <thead>
      <tr>
        <th>Cedula</th>
        <th>Nombres</th>
        <th>Asociacion</th>
        <th>Email</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody>
      @for (voter of voters; track voter.cedula) {
        <tr>
          <td>{{ voter.cedula }}</td>
          <td>{{ voter.nombres }}</td>
          <td>{{ voter.asociacion }}</td>
          <td><a href="#">{{ voter.email }}</a></td>
          <td><input type="checkbox" aria-label="Estado de {{ voter.nombres }}" /></td>
        </tr>
      }
    </tbody>
  </table>
</section>
